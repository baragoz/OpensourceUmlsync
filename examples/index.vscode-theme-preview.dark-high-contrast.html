<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMLSync — VS Code Dark High Contrast preview</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.14.1/jquery-ui.min.js" integrity="sha512-MSOo1aY+3pXCOCdGAYoBZ6YGI0aragoQsg1mKKBHXCYPIWxamwOE7Drh+N5CPgGI5SA9IEKJiPjdfqWFWmZtRA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Import Map to define module paths (requires `npm run build:editor` to have run) -->
    <script type="importmap">
        {
            "imports": {
                "umlsync": "../dist/editor/UMLSync.editor.cjs.js"
            }
        }
    </script>

    <!-- Base bundle: structural CSS + themes/default.css's baseline tokens -->
    <link rel="stylesheet" href="../dist/editor/style.css" />

    <script type="module" src="jsm/jquery.editable.js"></script>

    <!-- ============================================================
         DEMO-ONLY: simulated --vscode-* variables for VS Code's Dark High
         Contrast theme kind (body.vscode-high-contrast).

         This page runs in a plain browser tab, not a real VS Code webview,
         so none of the --vscode-* custom properties that vscode.dark2.css
         relies on actually exist here - every var(--vscode-*) reference
         would resolve to invalid and every token it feeds
         (--umlsync-canvas-bg etc.) would fall through to its own literal
         default, making the page look identical to the non-VS Code look.
         That's the CORRECT behavior for vscode.dark2.css itself; this
         block just fakes plausible approximations of VS Code's real Dark
         High Contrast palette so the preview is informative in a regular
         browser. Delete this block when embedding umlsync in an actual VS
         Code webview - real values are injected there automatically. -->
    <style>
        body.vscode-high-contrast {
            --vscode-editor-background: #000000;
            --vscode-editor-foreground: #ffffff;
            --vscode-foreground: #ffffff;
            --vscode-editorWidget-background: #000000;
            --vscode-input-background: #000000;
            --vscode-icon-foreground: #ffffff;
            --vscode-button-background: #000000;
            --vscode-list-hoverBackground: #1f1f1f;
            --vscode-errorForeground: #f48771;
            --vscode-badge-background: #000000;
            --vscode-badge-foreground: #ffffff;
            --vscode-descriptionForeground: #ffffff;
            --vscode-list-activeSelectionBackground: #04395e;
            --vscode-focusBorder: #f38518;
            --vscode-contrastBorder: #6fc3df;
            --vscode-contrastActiveBorder: #f38518;
            --vscode-charts-blue: #3794ff;
            --vscode-charts-orange: #d18616;
            --vscode-charts-green: #89d185;
            --vscode-charts-yellow: #d7ba7d;
            --vscode-disabledForeground: #a7a8a9;
            --vscode-menu-background: #000000;
            --vscode-menu-border: #6fc3df;
            --vscode-menu-selectionBackground: #04395e;
        }
    </style>
    <!-- ============================================================ -->

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: var(--umlsync-canvas-bg, #eee);
            color: var(--umlsync-ink, #000);
        }

        #us-theme-banner {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--toolbar-border-color, #ccc);
            background: var(--toolbar-bg-color, #fff);
            color: var(--toolbar-font-color, #333);
        }

        #us-theme-banner a {
            color: inherit;
            opacity: 0.75;
        }

        #diagram-placeholder {
            width: 100%;
            height: 60vh;
        }

        #us-swatches {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px;
        }

        .us-swatch {
            width: 120px;
            height: 60px;
            border: 1px solid var(--umlsync-ink, #000);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            text-align: center;
        }
    </style>

        <!-- Only this page's theme overlay - body.vscode-high-contrast below is
         hardcoded, so only vscode.dark2.css's rules (scoped to that same
         selector) ever apply here. -->
    <link rel="stylesheet" href="../dist/editor/assets/styles/themes/vscode.dark-high-contrast.css" />

</head>
<body class="vscode-high-contrast">
    <div id="us-theme-banner">
        <strong>VS Code theme: Dark High Contrast</strong>
        <span>&mdash; other kinds:</span>
        <a href="index.vscode-theme-preview.dark1.html">Dark</a>
        <a href="index.vscode-theme-preview.light1.html">Light</a>
        <a href="index.vscode-theme-preview.light2.html">Light High Contrast</a>
        <a href="index.html">Gallery</a>
    </div>

    <div id="diagram-placeholder"></div>

    <div id="us-swatches">
        <div class="us-swatch" style="background: var(--umlsync-fill-info);">fill-info<br>(state/collab.)</div>
        <div class="us-swatch" style="background: var(--umlsync-fill-warning);">fill-warning<br>(entity)</div>
        <div class="us-swatch" style="background: var(--umlsync-fill-success);">fill-success<br>(procedure)</div>
        <div class="us-swatch" style="background: var(--umlsync-fill-caution);">fill-caution<br>(resultset)</div>
        <div class="us-swatch" style="background: var(--umlsync-fill-datastore);">fill-datastore</div>
        <div class="us-swatch" style="background: var(--umlsync-note-bg);">note-bg</div>
        <div class="us-swatch" style="background: var(--umlsync-menu-bg); box-shadow: 0 2px 8px var(--umlsync-shadow-sm);">menu-bg<br>+ shadow-sm</div>
        <div class="us-swatch" style="background: var(--umlsync-accent);">accent<br>(selection)</div>
    </div>

    <script type="module">
        try {
            const { default: UMLSync } = await import("umlsync");

            const classDiagramJson = {"nameTemplate":"classDiagram","width":1058,"height":420,"globalId":6,"maxZIndex":1007,"elements":[{"width":293,"height":225,"left":40,"top":40,"name":"Common Package","id":1,"height_b":208,"nameTemplate":"package","z-index":1000},{"width":280,"height":165,"left":400,"top":80,"name":"IExample","aux":"Interface","operations":[{"id":1,"text":"createSomething()"},{"id":2,"text":"updatePayload()"}],"attributes":[{"id":0,"text":"someField"},{"id":2,"text":"someField2"}],"id":2,"height_a":37,"nameTemplate":"class","z-index":1002},{"width":180,"height":56,"left":760,"top":260,"id":3,"nameTemplate":"note","z-index":1003}],"connectors":[{"id":1,"nameTemplate":"anchor","epoints":[{"x":665,"y":150},{"x":760,"y":280}],"stored":true}]};

            const placeholder = $("#diagram-placeholder");
            const editor = new UMLSync.DiagramEditor("#diagram-placeholder", {
                width: placeholder.width(),
                height: placeholder.height(),
                fitToParent: true,
                devmode: true,
            });
            editor.loadDiagram(classDiagramJson, { width: placeholder.width(), height: placeholder.height(), editmode: true });
        } catch (err) {
            console.error("Diagram failed to load (swatches above still work independently):", err);
            document.getElementById("diagram-placeholder").textContent =
                "Diagram failed to load - see console. This page must be served over http(s) (e.g. `npm run dev`), not opened as a local file.";
        }
    </script>
</body>
</html>
